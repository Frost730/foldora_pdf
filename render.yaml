services:
  - type: web
    name: foldora-pdf
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MAX_UPLOAD_MB
        value: "35"
      - key: MAX_FILES_PER_JOB
        value: "20"
      - key: MAX_PAGES_PER_JOB
        value: "100"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_TTL_MINUTES
        value: "15"
      - key: MAX_PROCESSING_SECONDS
        value: "180"
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
